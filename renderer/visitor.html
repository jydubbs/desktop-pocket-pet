<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Pocket Pet visitor</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #v { position: absolute; inset: 0; cursor: pointer; }
  svg { position: absolute; left: 6px; bottom: 4px; width: 128px; height: 120px; overflow: visible; }
  .body { transform-box: view-box; transform-origin: 80px 141px; animation: bob 2.8s ease-in-out infinite; animation-delay: var(--delay, 0s); }
  .shadow { opacity: .25; }
  .wave { transform-box: view-box; transform-origin: 132px 108px; animation: wave 3.4s ease-in-out infinite; }
  .twinkle { transform-box: fill-box; transform-origin: center; animation: tw 1.8s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  @keyframes bob { 0%,100% { transform: scale(1.03, .97); } 50% { transform: translateY(-6px) scale(.98, 1.02); } }
  @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 75% { transform: rotate(-18deg); } 88% { transform: rotate(-6deg); } }
  #bubble { position: absolute; top: 2px; left: 50%; transform: translateX(-50%) scale(.9); width: max-content; max-width: 134px; background: #fff; color: #2f2843;
    border: 1.5px solid #eadff4; border-radius: 14px; padding: 5px 9px; font-size: 11.5px; font-weight: 700; line-height: 1.3; text-align: center;
    box-shadow: 0 3px 10px rgba(50, 30, 80, .18); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: #fff;
    border-right: 1.5px solid #eadff4; border-bottom: 1.5px solid #eadff4; transform: translateX(-50%) rotate(45deg); }
  @media (prefers-color-scheme: dark) { #bubble, #bubble::after { background: #2c2740; color: #f2eefa; border-color: #433b5c; } }
  #art { position: absolute; inset: 0; }
  .hopping #art { animation: hop .34s ease-out 1; }
  .walking #art { animation: waddle .32s ease-in-out 2; }
  @keyframes hop { 0% { transform: scale(1.06, .92); } 45% { transform: translateY(-10px) rotate(calc(var(--dir, 1) * 5deg)); } 100% { transform: scale(1); } }
  @keyframes waddle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg) translateY(-4px); } 75% { transform: rotate(6deg) translateY(-4px); } }
  .nuzzling #art { animation: nuzzle 2s ease-in-out 1; transform-origin: 50% 100%; }
  @keyframes nuzzle { 0%, 100% { transform: rotate(0); } 20%, 80% { transform: rotate(calc(var(--dir, 1) * 9deg)) translateX(calc(var(--dir, 1) * 6px)); }
    40% { transform: rotate(calc(var(--dir, 1) * 13deg)) translateX(calc(var(--dir, 1) * 8px)); } }
  .heart { position: absolute; width: 14px; height: 14px; pointer-events: none; animation: float 1.4s ease-out forwards; }
  @keyframes float { from { opacity: 0; transform: translateY(0) scale(.5); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(-40px) scale(.9); } }
  #tag { position: absolute; bottom: 0; left: 50%; transform: translate(-50%, 4px); background: rgba(58, 42, 85, .85); color: #fff;
    font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; opacity: 0; transition: opacity .2s, transform .2s; }
  #v:hover #tag { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .body, .wave, .twinkle, #art { animation: none !important; } }
</style>
</head>
<body>
<div id="v"><div id="bubble"></div><div id="art"></div><div id="tag"></div></div>
<script src="pet-art.js"></script>
<script src="visitor.js"></script>
</body>
</html>
