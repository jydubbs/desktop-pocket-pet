<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Pocket Pet History</title>
<style>
  /* Same family as the habit list: white cards, green accent, small uppercase labels. */
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #15181e; --muted: #8b919c; --line: #e9ecf0; --soft: #f0f2f5;
    --accent: #1f9a4b; --accent-ink: #fff;
    --study: #4a86e8; --fitness: #f08a3c; --mind: #9b6ee0; --health: #1fa8b5;
    --heat0: #eef1f4; --heat1: #d4efdd; --heat2: #a5dcb7; --heat3: #5fbf82; --heat4: #1f9a4b;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141619; --card: #1b1e23; --ink: #f3f5f7; --muted: #9aa1ab; --line: #2c3138; --soft: #23272d;
      --accent: #3cc06a; --accent-ink: #08140c;
      --heat0: #23272d; --heat1: #1f3a29; --heat2: #25603a; --heat3: #2f8f50; --heat4: #3cc06a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
  header { padding: 14px 20px 10px 84px; display: flex; align-items: center; justify-content: space-between; gap: 12px; -webkit-app-region: drag; }
  header button { -webkit-app-region: no-drag; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .tabs { display: inline-flex; background: var(--soft); border-radius: 12px; padding: 3px; gap: 2px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 13px;
    padding: 6px 14px; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 24, 30, .12); }
  main { flex: 1; overflow-y: auto; padding: 4px 20px 24px; }
  section { display: flex; flex-direction: column; gap: 16px; max-width: 760px; margin: 0 auto; }
  [hidden] { display: none !important; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* summary numbers */
  .totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .total { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .total b { display: block; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .total span { color: var(--muted); font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

  /* calendar */
  .cal { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px 16px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head h2 { margin: 0; font-size: 16px; }
  .nav { border: 1px solid var(--line); background: transparent; color: var(--ink); width: 32px; height: 32px; border-radius: 10px; font-size: 16px; cursor: pointer; }
  .nav:disabled { opacity: .35; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .dow { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .06em; padding-bottom: 2px; }
  .day { position: relative; aspect-ratio: 1.7; max-height: 54px; border-radius: 10px; background: var(--heat0); display: flex; align-items: flex-start;
    justify-content: flex-start; padding: 5px 7px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); min-width: 0; }
  .day.l1 { background: var(--heat1); } .day.l2 { background: var(--heat2); } .day.l3 { background: var(--heat3); color: #fff; }
  .day.l4 { background: var(--heat4); color: var(--accent-ink); }
  .day.future { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .day.today { box-shadow: 0 0 0 2px var(--ink); }
  .day .star { position: absolute; right: 6px; bottom: 4px; width: 12px; height: 12px; }
  .legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

  /* streaks */
  .habit { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid;
    grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
  .habit .name { font-weight: 700; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; }
  .habit .name i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .habit .meta { color: var(--muted); font-size: 12px; }
  .nums { display: flex; gap: 16px; text-align: right; font-variant-numeric: tabular-nums; }
  .nums b { display: block; font-size: 20px; line-height: 1.1; }
  .nums span { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .strip { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }
  .strip span { height: 14px; border-radius: 4px; background: var(--line); }
  .strip .done { background: var(--cat); }
  .strip .off, .strip .none { background: transparent; border: 1px dashed var(--line); }
  .strip .today { background: transparent; box-shadow: inset 0 0 0 2px var(--cat); }
  .strip-legend { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; grid-column: 1 / -1; margin-top: -4px; }

  /* pets */
  .pets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .pet { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .pet .portrait { display: flex; justify-content: center; background: var(--soft); border-radius: 14px; padding: 6px 0 2px; }
  .pet .portrait svg { width: 110px; height: 104px; overflow: visible; }
  .pet h3 { margin: 0; font-size: 16px; }
  .pet .where { color: var(--muted); font-size: 12px; margin-top: -6px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
  .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .timeline li { display: flex; justify-content: space-between; gap: 8px; }
  .timeline li span:first-child { color: var(--muted); }
  .timeline li.pending span:last-child { color: var(--muted); font-weight: 400; }
  .timeline li span:last-child { font-weight: 700; }
  .mini { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); }
  .mini i { height: 100%; }
  .empty { color: var(--muted); text-align: center; padding: 24px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
  @media (max-width: 560px) { .totals { grid-template-columns: 1fr; } }
  html[data-os="win32"] header, html[data-os="linux"] header { padding-left: 20px; }
</style>
</head>
<body>
<header>
  <h1>History</h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-calendar" aria-selected="true">Calendar</button>
    <button role="tab" id="tab-streaks" aria-selected="false">Streaks</button>
    <button role="tab" id="tab-pets" aria-selected="false">Pets</button>
  </div>
</header>
<main>
  <section id="calendar">
    <div class="totals">
      <div class="total"><b id="tTicks">0</b><span>habits ticked</span></div>
      <div class="total"><b id="tPerfect">0</b><span>perfect days</span></div>
      <div class="total"><b id="tRow">0</b><span>days in a row</span></div>
    </div>
    <div class="cal">
      <div class="cal-head">
        <button class="nav" id="prev" aria-label="Previous month">‹</button>
        <h2 id="monthName"></h2>
        <button class="nav" id="next" aria-label="Next month">›</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">Less <i style="background:var(--heat0)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--heat3)"></i><i style="background:var(--heat4)"></i> More · a star means everything was done</div>
    </div>
  </section>
  <section id="streaks" hidden></section>
  <section id="pets" hidden></section>
</main>
<script src="os.js"></script>
<script src="pet-art.js"></script>
<script src="history.js"></script>
</body>
</html>
