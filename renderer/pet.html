<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Pocket Pet</title>
<style>
  :root { --badge: #ffffff; --badge-ink: #4a3f63; --done: #6cc596; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; }
  #pet { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  #pet.dragging { cursor: grabbing; }
  #art { position: absolute; inset: 0; } /* keeps the drawing in place while it animates */
  #art svg { position: absolute; left: 10px; bottom: 6px; width: 160px; height: 150px; overflow: visible; }

  /* idle bob */
  .body { transform-box: view-box; transform-origin: 80px 141px; animation: bob 2.4s ease-in-out infinite; }
  .shadow { transform-box: view-box; transform-origin: 80px 142px; animation: shadow 2.4s ease-in-out infinite; opacity: .3; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes bob { 0%,100% { transform: scale(1.04, .96); } 50% { transform: translateY(-8px) scale(.98, 1.03); } }
  @keyframes shadow { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(.8); opacity: .2; } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  #pet:hover .body { animation-duration: 1.4s; }

  /* moods */
  .mood-sleepy .body { animation: breathe 3.6s ease-in-out infinite; }
  .mood-droopy .body { animation: droop 4.2s ease-in-out infinite; }
  .mood-sleepy .shadow, .mood-droopy .shadow { animation: none; }
  @keyframes breathe { 0%,100% { transform: scale(1.04, .95); } 50% { transform: scale(1.01, .99); } }
  @keyframes droop { 0%,100% { transform: scale(1.08, .9); } 50% { transform: scale(1.06, .93); } }
  .zz { animation: zz 2.4s ease-in-out infinite; }
  @keyframes zz { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .8; } 100% { opacity: 0; transform: translateY(-8px); } }

  /* little hops, and leaning in for a nuzzle */
  .hopping #art { animation: hop .34s ease-out 1; }
  @keyframes hop { 0% { transform: scale(1.06, .92); } 45% { transform: translateY(-14px) rotate(calc(var(--dir, 1) * 6deg)) scale(.96, 1.05); }
    100% { transform: scale(1); } }
  .nuzzling #art { animation: nuzzle 1.9s ease-in-out 1; transform-origin: 50% 100%; }
  @keyframes nuzzle { 0%, 100% { transform: rotate(0); } 20%, 80% { transform: rotate(calc(var(--dir, 1) * 9deg)) translateX(calc(var(--dir, 1) * 6px)); }
    40% { transform: rotate(calc(var(--dir, 1) * 13deg)) translateX(calc(var(--dir, 1) * 8px)); } 60% { transform: rotate(calc(var(--dir, 1) * 7deg)) translateX(calc(var(--dir, 1) * 6px)); } }

  /* a shiny hatching: golden rays */
  .rays { position: absolute; left: 90px; top: 100px; width: 0; height: 0; z-index: 0; animation: raysIn 2.6s ease-out forwards; }
  .rays i { position: absolute; left: -3px; top: 0; width: 6px; height: 90px; border-radius: 6px; transform-origin: 50% 0;
    background: linear-gradient(#ffe27a, rgba(255, 226, 122, 0)); }
  @keyframes raysIn { 0% { opacity: 0; transform: scale(.3) rotate(0); } 20% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1) rotate(60deg); } }
  .spark.gold { background: radial-gradient(circle, #fff 0 30%, #ffd54a 31% 60%, transparent 61%); }

  /* name on hover */
  #nameplate { position: absolute; bottom: 0; left: 50%; transform: translate(-50%, 4px); z-index: 2;
    background: rgba(58, 42, 85, .85); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 9px;
    border-radius: 99px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s, transform .2s; }
  #pet:hover #nameplate:not(:empty) { opacity: 1; transform: translate(-50%, 0); }
  #pet.dragging #nameplate { opacity: 0; }

  /* adult's waving arm */
  .wave { transform-box: view-box; transform-origin: 132px 108px; animation: wave 2.6s ease-in-out infinite; }
  @keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-18deg); } 80% { transform: rotate(6deg); } 90% { transform: rotate(-14deg); } }

  /* outfits */
  .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 1.8s ease-in-out infinite; }
  .twinkle:nth-of-type(2n) { animation-delay: .6s; }
  .twinkle:nth-of-type(3n) { animation-delay: 1.1s; }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
  .halo { animation: halo 3s ease-in-out infinite; }
  @keyframes halo { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* egg */
  .egg { animation: rock 4s ease-in-out infinite; }
  @keyframes rock { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-4deg); } 90% { transform: rotate(4deg); } 95% { transform: rotate(-2deg); } }

  /* expressions */
  .face-eat .chomp { transform-box: fill-box; transform-origin: center; animation: chomp .22s ease-in-out infinite alternate; }
  @keyframes chomp { from { transform: scaleY(1); } to { transform: scaleY(.25); } }
  .face-giggle .body, .poked .egg { animation: wiggle .45s ease-in-out 2; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg) translateY(-4px); } 75% { transform: rotate(7deg) translateY(-4px); } }
  #pet.dragging .body { animation: dangle .5s ease-in-out infinite alternate; }
  @keyframes dangle { from { transform: scale(.94, 1.08) rotate(-4deg); } to { transform: scale(.94, 1.08) rotate(4deg); } }
  .landed .body { animation: land .45s ease-out 1; }
  @keyframes land { 0% { transform: scale(1.18, .8); } 60% { transform: scale(.95, 1.06); } 100% { transform: scale(1); } }
  .evolving #art { animation: evolve 1.4s ease-in-out 1; }
  @keyframes evolve { 0% { filter: brightness(1); transform: scale(1); } 40% { filter: brightness(2.2) saturate(.3); transform: scale(1.12); }
    70% { filter: brightness(1.6); transform: scale(.94); } 100% { filter: brightness(1); transform: scale(1); } }

  /* treat and hearts */
  .treat { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none;
    animation: drop .7s cubic-bezier(.4, 0, .9, .6) forwards; }
  @keyframes drop { 0% { opacity: 0; transform: translateY(-70px) rotate(-30deg) scale(1); }
    20% { opacity: 1; } 80% { transform: translateY(0) rotate(10deg) scale(1); opacity: 1; }
    100% { transform: translateY(2px) scale(.2); opacity: 0; } }
  .heart { position: absolute; width: 16px; height: 16px; margin-left: -8px; pointer-events: none;
    animation: float 1.4s ease-out forwards; }
  @keyframes float { 0% { opacity: 0; transform: translateY(0) scale(.5); } 20% { opacity: 1; transform: translateY(-8px) scale(1); }
    100% { opacity: 0; transform: translateY(-46px) translateX(var(--dx, 0)) scale(.9); } }
  .spark { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff 0 30%, #ffd3ea 31% 60%, transparent 61%);
    animation: burst 1s ease-out forwards; }
  @keyframes burst { from { opacity: 1; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); } }

  #badge { position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    background: var(--badge); color: var(--badge-ink); font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 99px; box-shadow: 0 2px 6px rgba(60, 40, 90, .18);
    white-space: nowrap; pointer-events: none; transition: opacity .3s; z-index: 2; }
  #badge.alldone { background: var(--done); color: #fff; }
  #badge.preview { background: #4a3f63; color: #fff; }
  #badge:empty, .talking #badge { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .body, .shadow, .eye, .egg, .zz, .treat, .heart, .spark, .twinkle, .halo, .wave, #art, .hopping #art, .nuzzling #art, .rays { animation: none !important; }
  }
</style>
</head>
<body>
<div id="pet" title="Click for habits · double-click to poke · drag to move · right-click for options">
  <div id="badge"></div>
  <div id="art"></div>
  <div id="nameplate"></div>
</div>
<script src="pet-art.js"></script>
<script src="pet.js"></script>
</body>
</html>
